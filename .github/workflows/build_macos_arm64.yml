# =============================================================================
# build_macos_arm64.yml
#
# Builds Y-Up Blender for Apple Silicon (arm64) on a native macOS-14 runner
# (GitHub-hosted M1 Mac — free for public repos).
#
# Triggers on every push to main and is also manually dispatchable.
# Publishes the resulting Blender.app as a tar.xz to a rolling GitHub Release.
#
# Binary format: Mach-O 64-bit executable arm64 (verified in the workflow).
# No code-signing: users right-click → Open to bypass Gatekeeper on first run.
# =============================================================================

name: Build — macOS Apple Silicon (ARM64)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos-arm64:
    name: macOS ARM64 · Full Release
    runs-on: macos-14          # Native Apple Silicon M1 (3 vCPU, 7 GB RAM)
    timeout-minutes: 360       # 6-hour hard limit

    steps:
      # -----------------------------------------------------------------------
      # 1. Free up disk space — the runner ships with ~14 GB, Blender needs ~12 GB
      # -----------------------------------------------------------------------
      - name: Free disk space
        run: |
          echo "=== Disk before cleanup ==="
          df -h /
          # Remove heavy pre-installed Xcode simulators & documentation
          sudo rm -rf /Library/Developer/CoreSimulator
          sudo rm -rf /Applications/Xcode.app/Contents/Developer/Platforms/AppleTVOS.platform
          sudo rm -rf /Applications/Xcode.app/Contents/Developer/Platforms/WatchOS.platform
          sudo rm -rf /Applications/Xcode.app/Contents/Developer/Platforms/WatchSimulator.platform
          sudo rm -rf /Applications/Xcode.app/Contents/Developer/Platforms/AppleTVSimulator.platform
          sudo rm -rf /Applications/Xcode.app/Contents/Developer/Documentation
          sudo rm -rf /Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0
          sudo rm -rf /usr/local/lib/android /usr/local/share/powershell /usr/share/dotnet
          echo "=== Disk after cleanup ==="
          df -h /

      # -----------------------------------------------------------------------
      # 2. Checkout — blender/ is tracked as committed files, not a submodule
      # -----------------------------------------------------------------------
      - name: Checkout YUpBlender
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # git lfs pull --include is broken on this runner (silent no-op regardless
      # of auth config). Use the LFS HTTP batch API directly instead — verified
      # to work without auth (returns S3 pre-signed URLs).
      - name: Download LFS files via HTTP batch API
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, os, sys

          SCAN_DIRS = [
              "blender/release/datafiles",
              "blender/assets",
              "blender/release/darwin",
              "blender/scripts/startup",
          ]
          GH_LFS  = "https://github.com/scrubjay/YUpBlender.git/info/lfs/objects/batch"
          BL_LFS  = "https://projects.blender.org/blender/blender.git/info/lfs/objects/batch"
          HDR     = {"Accept": "application/vnd.git-lfs+json",
                     "Content-Type": "application/vnd.git-lfs+json"}

          # ---- Collect all LFS pointer files in the dirs we care about ----
          pointers = []
          for scan_dir in SCAN_DIRS:
              if not os.path.isdir(scan_dir):
                  continue
              for root, _, files in os.walk(scan_dir):
                  for fname in files:
                      path = os.path.join(root, fname)
                      try:
                          if os.path.getsize(path) > 512:
                              continue
                          raw = open(path, "rb").read(300).decode("utf-8", errors="ignore")
                          if "git-lfs.github.com/spec/v1" not in raw:
                              continue
                          oid = size = None
                          for line in raw.splitlines():
                              if line.startswith("oid sha256:"):
                                  oid = line.split(":", 1)[1].strip()
                              elif line.startswith("size "):
                                  size = int(line.split()[1])
                          if oid and size:
                              pointers.append((path, oid, size))
                      except Exception:
                          pass

          if not pointers:
              print("No LFS pointers found.")
              sys.exit(0)
          print(f"Found {len(pointers)} LFS pointer(s).")

          def batch_urls(api_url, objects):
              body = json.dumps({"operation": "download",
                                 "transfers": ["basic"],
                                 "objects": objects}).encode()
              req = urllib.request.Request(api_url, data=body, headers=HDR)
              try:
                  resp = json.loads(urllib.request.urlopen(req, timeout=60).read())
                  return {o["oid"]: o.get("actions", {}).get("download", {}).get("href")
                          for o in resp.get("objects", [])}
              except Exception as e:
                  print(f"  batch API error ({api_url}): {e}")
                  return {}

          objects = [{"oid": oid, "size": sz} for _, oid, sz in pointers]

          # Try GitHub LFS first (has fork-specific objects), then blender.org
          gh_urls = batch_urls(GH_LFS, objects)
          bl_urls = batch_urls(BL_LFS, objects)

          for path, oid, expected_size in pointers:
              url = gh_urls.get(oid) or bl_urls.get(oid)
              if not url:
                  print(f"  WARN: no URL for {path} (oid {oid[:12]}...)")
                  continue
              print(f"  downloading {path} ({expected_size} B) ...")
              urllib.request.urlretrieve(url, path)
              actual = os.path.getsize(path)
              status = "OK" if actual == expected_size else f"WARN size={actual}"
              print(f"    {status}")

          # Hard-check startup.blend
          critical = "blender/release/datafiles/startup.blend"
          sz = os.path.getsize(critical)
          if sz < 1024:
              print(f"FATAL: {critical} is still a pointer ({sz} B)!", file=sys.stderr)
              sys.exit(1)
          print(f"startup.blend OK: {sz} bytes.")
          PYEOF



      # -----------------------------------------------------------------------
      # 3. Install build tools
      #    git-lfs is required to pull the LFS-tracked binaries in the lib repo
      # -----------------------------------------------------------------------
      - name: Install build dependencies
        run: |
          brew update --quiet
          brew install cmake ninja git-lfs
          git lfs install
          # Ensure Xcode toolchain is selected — CMake needs this on macos-14
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          clang --version

      # -----------------------------------------------------------------------
      # 4. Cache the precompiled macOS ARM64 libraries
      #    Key: hash of the versions file that controls which lib commit is used.
      #    The lib repo is ~2–3 GB; caching saves ~15 minutes per run.
      # -----------------------------------------------------------------------
      - name: Cache lib/macos_arm64
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: blender/lib/macos_arm64
          key: blender-macos-arm64-libs-${{ hashFiles('blender/build_files/build_environment/cmake/versions.cmake') }}
          restore-keys: |
            blender-macos-arm64-libs-

      # -----------------------------------------------------------------------
      # 5. Fetch the precompiled libraries (skipped if cache hit)
      #
      # WHY NOT make_update.py:
      #   make_update.py runs `git rev-parse --show-toplevel` and resolves the
      #   git root as the YUpBlender repo — which has no lib submodules in its
      #   .gitmodules. Only blender/.gitmodules knows about lib-macos_arm64.
      #   This causes exit code 2 ("Skipping libraries update: no configured
      #   submodule").
      #
      # FIX: Clone the lib repo directly from its URL (declared in
      #   blender/.gitmodules) and place it where CMake expects it.
      #   LFS objects are fetched automatically by `git lfs pull`.
      # -----------------------------------------------------------------------
      - name: Fetch precompiled libraries (macos_arm64)
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: |
          echo "=== Disk before lib fetch ==="
          df -h /
          # Clone without LFS smudge first (faster), then pull LFS objects explicitly
          GIT_LFS_SKIP_SMUDGE=1 git clone \
            --depth=1 \
            --branch main \
            https://projects.blender.org/blender/lib-macos_arm64.git \
            blender/lib/macos_arm64
          cd blender/lib/macos_arm64
          git lfs pull
          echo "=== Disk after lib fetch ==="
          df -h /

      # -----------------------------------------------------------------------
      # Verify the lib dir has real files (not just LFS pointer stubs)
      # A pointer file is ~130 bytes; real .a libs are megabytes.
      # -----------------------------------------------------------------------
      - name: Verify lib/macos_arm64 contents
        run: |
          echo "=== Top-level lib dir ==="
          ls -lh blender/lib/macos_arm64/ | head -30
          echo "=== Checking for real vs pointer files ==="
          # Find the first .a file and check its size
          SAMPLE=$(find blender/lib/macos_arm64 -name '*.a' | head -1)
          if [ -n "$SAMPLE" ]; then
            SIZE=$(wc -c < "$SAMPLE")
            echo "Sample lib: $SAMPLE  ($SIZE bytes)"
            if [ "$SIZE" -lt 1000 ]; then
              echo "ERROR: File looks like an LFS pointer stub (< 1 KB). LFS pull failed!"
              cat "$SAMPLE"
              exit 1
            else
              echo "OK: Real binary file confirmed."
            fi
          else
            echo "WARNING: No .a files found in lib/macos_arm64"
          fi

      # -----------------------------------------------------------------------
      # 6. Configure CMake with the official release preset
      #    blender_release.cmake enables: Cycles + Metal, OIDN, USD, OpenVDB,
      #    Embree, OSL, path guiding, all codecs, and every other release flag.
      #    CUDA/OptiX/HIP are automatically excluded on Apple (cmake config
      #    guards them with NOT APPLE).
      # -----------------------------------------------------------------------
      - name: Configure CMake
        run: |
          echo "=== CMake version ==="
          cmake --version
          echo "=== Xcode path ==="
          xcode-select -p
          echo "=== lib/macos_arm64 exists? ==="
          ls blender/lib/macos_arm64/ | head -5
          cmake \
            -S blender \
            -B build \
            -C blender/build_files/cmake/config/blender_release.cmake \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            --log-level=VERBOSE

      # -----------------------------------------------------------------------
      # 7. Build — uses all available cores on the M1 runner
      # -----------------------------------------------------------------------
      - name: Build Blender
        run: |
          echo "=== Disk before build ==="
          df -h /
          ninja -C build -j$(sysctl -n hw.logicalcpu) install
          echo "=== Disk after build ==="
          df -h /

      # -----------------------------------------------------------------------
      # 8. Verify the output is genuinely a Mach-O arm64 binary
      # -----------------------------------------------------------------------
      - name: Verify Mach-O arm64
        run: |
          BLENDER_BIN="build/bin/Blender.app/Contents/MacOS/Blender"
          echo "--- file ---"
          file "$BLENDER_BIN"
          echo "--- lipo ---"
          lipo -info "$BLENDER_BIN"
          # Hard-fail if the binary is not arm64
          file "$BLENDER_BIN" | grep -q "arm64" || \
            (echo "ERROR: Binary is not arm64!" && exit 1)

      # -----------------------------------------------------------------------
      # 9. Package as a tar.xz archive
      # -----------------------------------------------------------------------
      - name: Package Blender.app
        run: |
          cd build/bin
          tar -cJf ../../blender_yup_macos_arm64.tar.xz Blender.app
          ls -lh ../../blender_yup_macos_arm64.tar.xz

      # -----------------------------------------------------------------------
      # 10. Free build intermediates to avoid hitting artifact upload limits
      # -----------------------------------------------------------------------
      - name: Clean build tree
        run: |
          rm -rf build
          df -h /

      # -----------------------------------------------------------------------
      # 11. Publish to GitHub Releases (rolling "latest" tag for macOS)
      #     Force-pushes the tag so each build overwrites the previous one.
      #     GITHUB_TOKEN has repo write access automatically in Actions.
      # -----------------------------------------------------------------------
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-macos-arm64
          name: "Blender Y-Up — macOS Apple Silicon (Latest)"
          prerelease: true
          make_latest: false
          files: blender_yup_macos_arm64.tar.xz
          body: |
            ## Blender Y-Up — macOS Apple Silicon (ARM64 · M1/M2/M3/M4)

            **Auto-built** from [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) on ${{ github.event.head_commit.timestamp }}

            ---

            ### What's included
            | Feature | Status |
            |---------|--------|
            | Y-Up viewport | ✅ Y axis is up, Z is forward (Unity/Unreal-style) |
            | Metal GPU rendering | ✅ Hardware-accelerated Cycles on Apple Silicon |
            | OpenImageDenoise | ✅ AI denoising |
            | Cycles + Embree | ✅ CPU path tracing |
            | USD / OpenVDB / Alembic | ✅ Full pipeline formats |
            | OSL shaders | ✅ Open Shading Language |
            | Python scripting | ✅ Bundled Python |

            ---

            ### First Launch — Gatekeeper Warning
            > This binary is **not code-signed**. macOS Gatekeeper will block it on first open.
            >
            > **To bypass:** Right-click `Blender.app` → **Open** → click **Open** in the dialog.
            > You only need to do this once.

            ---

            ### Requirements
            - macOS 13 Ventura or later
            - Apple Silicon Mac (M1, M2, M3, or M4)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
